name: Task
description: A piece of work to do
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when this is done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is explicitly not.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist (`- [ ] ...`) of verifiable conditions.
  - type: textarea
    id: links
    attributes:
      label: Related issues
      description: For example `SCFlowOrg/scflow-core#12`.
