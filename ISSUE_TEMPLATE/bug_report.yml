name: Bug report
description: Report a defect in a SCFlow component
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Web or Tauri desktop, operating system, browser, version or commit.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, related issues. Never include secrets or private data.
